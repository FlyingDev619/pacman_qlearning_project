name: Train Pac-Man Q-learning

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pacman-qlearning-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Train until validation exceeds 90%
        shell: bash
        run: |
          set +e
          timeout 350m python -u train.py --until-target --eval-episodes 200 --check-every 100 --target 90 --resume
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          echo "Training ended or reached the runner time limit (exit $status)."
          exit 0

      - name: Independently evaluate saved checkpoint
        if: always()
        run: |
          if [ -f q_table.json ]; then
            python evaluate.py --qtable q_table.json --episodes 200 --seeds 95101 95102 95103 95104 95105
          else
            echo "No q_table.json checkpoint was produced."
          fi

      - name: Upload trained Q-table and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacman-qlearning-checkpoint
          path: |
            q_table.json
          if-no-files-found: warn
          retention-days: 30
